[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
 h2zero/NimBLE-Arduino@1.4.2
 bblanchon/ArduinoJson@6.21.5

; ESP32-S3 DevKitC-1 (web dashboard only)
[env:esp32-s3]
build_src_filter = +<*> -<viewer/> -<p4/>
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-3248S035 "Cheap Yellow Display" 3.5" (web + on-board dashboard)
[env:esp32-035]
build_src_filter = +<*> -<viewer/> -<p4/>
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
 ${env.lib_deps}
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBATTLAB_CYD35 -DBATTLAB_DISPLAY
 ; Bluetooth: one link to the BMS + one to the setup web page; no observer role.
 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

; ESP32-3248S035 as a BattLab CLOUD SCREEN: no Bluetooth, shows and controls
; every battery of a BattLab Cloud account over Wi-Fi.
[env:cyd35-cloud]
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
 bblanchon/ArduinoJson@6.21.5
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBATTLAB_CYD35 -DBATTLAB_VIEWER
build_src_filter = -<*> +<viewer/>

; LCDwiki ES3C40P 4.0" 480x320 IPS (ST7796S SPI + FT6336U capacitive touch),
; ESP32-S3 N16R8 (16MB flash, 8MB OPI PSRAM). Full S3 features + on-board screen.
; RS485 module on the UART header: RX 44, TX 43.
[env:es3c40]
build_src_filter = +<*> -<viewer/> -<p4/>
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps =
 ${env.lib_deps}
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBATTLAB_ES3C40 -DBATTLAB_CYD35 -DBATTLAB_DISPLAY
 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

; ES3C40P as a BattLab CLOUD SCREEN (Wi-Fi only, every battery of an account).
[env:es3c40-cloud]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps =
 bblanchon/ArduinoJson@6.21.5
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBATTLAB_ES3C40 -DBATTLAB_CYD35 -DBATTLAB_VIEWER
 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
build_src_filter = -<*> +<viewer/>

; KSDIY ESP32-P4C5: ESP32-P4 (RISC-V, no radio) + ESP32-C5 Wi-Fi/BLE co-processor,
; 4.3" 480x800 MIPI-DSI + ST7123 touch, built-in RS485, 16MB flash / 32MB PSRAM.
; Needs the pioarduino platform (Arduino core on ESP-IDF 5.3+); the stock
; espressif32@6.9.0 above cannot build P4. Phase 1 target: compile + boot.
[env:p4c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
build_src_filter = -<*> +<p4/>
lib_deps =
lib_ldf_mode = chain
board_build.flash_size = 16MB
build_flags = -DBATTLAB_P4 -DARDUINO_USB_CDC_ON_BOOT=1
