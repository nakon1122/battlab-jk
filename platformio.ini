; Bambu LAN -> Cloud bridge + remote screens
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5

; Bridge: any ESP32-S3 board (DevKitC-1, Super Mini, N16R8 ...). No screen needed.
[env:bridge-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = -<*> +<bridge/>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; Bridge on ESP32-S3 with octal PSRAM (N16R8 / N8R8 / N32R8) - camera for A1/P1
[env:bridge-s3-r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<bridge/>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM

; Bridge on ESP32-S3 with quad PSRAM (N8R2 / N4R2) - camera for A1/P1
[env:bridge-s3-r2]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_src_filter = -<*> +<bridge/>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM

; Remote screen: ESP32-2432S028 "CYD" 2.8" 320x240
[env:screen-cyd28]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<screen/>
lib_deps = ${env.lib_deps}
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBB_CYD28

; Remote screen: ESP32-3248S035 3.5" 480x320
[env:screen-cyd35]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<screen/>
lib_deps = ${env.lib_deps}
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBB_CYD35
