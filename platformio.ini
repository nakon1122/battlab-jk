[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
 h2zero/NimBLE-Arduino@1.4.2
 bblanchon/ArduinoJson@6.21.5

; ESP32-S3 DevKitC-1 (web dashboard only)
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-3248S035 "Cheap Yellow Display" 3.5" (web + on-board dashboard)
[env:esp32-035]
board = esp32dev
board_build.partitions = huge_app.csv
lib_deps =
 ${env.lib_deps}
 lovyan03/LovyanGFX@1.1.16
build_flags = -DBATTLAB_CYD35 -DBATTLAB_DISPLAY
 ; Bluetooth: we only scan and connect, so drop the roles we never use and
 ; keep a single connection to save RAM on the classic ESP32.
 -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
 -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
