name: Build firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO and esptool
        run: pip install platformio esptool==4.5.1
      - name: Native decoder tests
        run: g++ -std=c++17 -o other_test test/other_bms_test.cpp && ./other_test && g++ -std=c++17 -o params_test test/params_test.cpp && ./params_test && g++ -std=c++17 -o settings_test test/settings_test.cpp && ./settings_test && g++ -std=c++17 -o rs485_test test/rs485_test.cpp && ./rs485_test && g++ -std=c++17 -Iinclude -o bank_test test/bank_test.cpp && ./bank_test && g++ -std=c++17 -o improv_test test/improv_test.cpp && ./improv_test && g++ -std=c++17 -o daly_test test/daly_test.cpp && ./daly_test && g++ -std=c++17 -Iinclude -o lux_test test/lux_test.cpp && ./lux_test
      - name: Web UI test (lighting page)
        run: |
          set -o pipefail
          mkdir -p $GITHUB_WORKSPACE/out /tmp/uit && cd /tmp/uit && npm i -s jsdom@24 >/dev/null
          NODE_PATH=/tmp/uit/node_modules node $GITHUB_WORKSPACE/test/ui_led_test.cjs 2>&1 | tee $GITHUB_WORKSPACE/out/ui-test.log
      - name: Render CYD35 screen previews
        run: |
          sudo apt-get install -y -qq fonts-freefont-ttf >/dev/null
          pip install -q pillow
          python tools/render_screens.py
          python tools/render_viewer.py
          mkdir -p out/screens && cp assets/screens/*.png out/screens/
      - name: Build both boards
        run: |
          set -o pipefail
          mkdir -p out
          pio run -e esp32-s3 -e esp32-035 -e cyd35-cloud 2>&1 | tee out/build.log
      - name: Make single install images (flash at 0x0)
        run: |
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          S3=.pio/build/esp32-s3
          python -m esptool --chip esp32s3 merge_bin -o out/BATTLAB_S3_BLEFIX_INSTALL.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 $S3/bootloader.bin 0x8000 $S3/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $S3/firmware.bin
          CY=.pio/build/esp32-035
          python -m esptool --chip esp32 merge_bin -o out/BATTLAB_CYD35_INSTALL.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $CY/bootloader.bin 0x8000 $CY/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $CY/firmware.bin
          CL=.pio/build/cyd35-cloud
          python -m esptool --chip esp32 merge_bin -o out/BATTLAB_CLOUDSCREEN_INSTALL.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $CL/bootloader.bin 0x8000 $CL/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $CL/firmware.bin
          cp $CL/firmware.bin out/BATTLAB_CLOUDSCREEN_APP_UPDATE.bin
          # pieces for the UPDATE_*.bat scripts (keep settings, switch to the OTA partition table)
          cp $S3/bootloader.bin out/S3_BOOTLOADER.bin
          cp $S3/partitions.bin out/S3_PARTITIONS.bin
          cp .pio/build/esp32-035/bootloader.bin out/CYD_BOOTLOADER.bin
          cp .pio/build/esp32-035/partitions.bin out/CYD_PARTITIONS.bin
          cp "$BOOT_APP0" out/BOOT_APP0.bin
          # app-only images: update without erasing settings (Wi-Fi, pair code, calibration)
          cp $S3/firmware.bin out/BATTLAB_S3_APP_UPDATE.bin
          cp $CY/firmware.bin out/BATTLAB_CYD35_APP_UPDATE.bin
          grep -E "RAM:|Flash:" out/build.log > out/SIZES.txt || true
          (cd out && sha256sum *.bin > SHA256SUMS.txt)
      - name: Publish binaries to firmware-build branch
        if: always()
        run: |
          trap 'echo "::error::publish failed at: $BASH_COMMAND (exit $?)"' ERR
          git config user.name "battlab-ci"
          git config user.email "battlab-ci@users.noreply.github.com"
          git checkout --orphan firmware-build
          git read-tree --empty            # branch holds only firmware/
          mkdir -p firmware/screens
          find out -maxdepth 1 -type f -exec cp {} firmware/ \;
          cp out/screens/*.png firmware/screens/ 2>/dev/null || true
          git add -f firmware/
          git commit -qm "firmware for ${GITHUB_SHA::7} (${{ job.status }})"
          git push -f origin firmware-build 2>&1 | tail -5

  # ESP32-P4C5 (experimental): new RISC-V toolchain via the pioarduino platform.
  # Separate job, continue-on-error, so a P4 failure never blocks the real release.
  p4:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Install esptool
        run: pip install esptool==4.8.1
      - name: Build ESP32-P4C5 (phase 1)
        run: pio run -e p4c5 2>&1 | tee p4-build.log
      - name: Merge a single flashable image
        run: |
          python - <<'PY'
          import json, subprocess
          d = json.load(open(".pio/build/p4c5/flasher_args.json"))
          fl = d.get("flash_settings", {})
          args = ["python","-m","esptool","--chip","esp32p4","merge_bin","-o","p4out_merge.bin",
                  "--flash_mode", fl.get("flash_mode","dio"), "--flash_freq", fl.get("flash_freq","80m"),
                  "--flash_size", fl.get("flash_size","16MB")]
          for off, fname in sorted(d["flash_files"].items(), key=lambda x: int(x[0],16)):
              args += [off, fname]
          print(" ".join(args))
          subprocess.run(args, cwd=".pio/build/p4c5", check=True)
          PY
          cp .pio/build/p4c5/p4out_merge.bin BATTLAB_P4C5_INSTALL.bin
      - name: Upload P4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4c5-build
          path: |
            .pio/build/p4c5/firmware.bin
            p4-build.log
          if-no-files-found: ignore
      - name: Publish P4 binary to the p4-build branch
        if: always()
        run: |
          git config user.name "battlab-ci"
          git config user.email "battlab-ci@users.noreply.github.com"
          mkdir -p p4out
          cp .pio/build/p4c5/firmware.bin p4out/BATTLAB_P4C5_APP.bin 2>/dev/null || true
          cp BATTLAB_P4C5_INSTALL.bin p4out/ 2>/dev/null || true
          cp .pio/build/p4c5/bootloader.bin p4out/P4_BOOTLOADER.bin 2>/dev/null || true
          cp .pio/build/p4c5/partitions.bin p4out/P4_PARTITIONS.bin 2>/dev/null || true
          cp .pio/build/p4c5/flasher_args.json p4out/ 2>/dev/null || true
          cp p4-build.log p4out/ 2>/dev/null || true
          git checkout --orphan p4-build
          git read-tree --empty
          git add -f p4out/
          git commit -qm "P4 build for ${GITHUB_SHA::7} (${{ job.status }})" || exit 0
          git push -f origin p4-build 2>&1 | tail -5
