<style>
:root{--bg:#0b1117;--card:#18212a;--line:#2d3a46;--text:#ecf1f4;--muted:#84939e;--accent:#36c4a8;--good:#40c878;--warn:#e8a040;--bad:#e85458;--blue:#5494e8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px);background:var(--bg);border-bottom:1px solid var(--line)}
header img{height:30px}header .sp{flex:1}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer}
button.soft{background:var(--card);color:var(--text);border:1px solid var(--line)}button.danger{background:var(--card);color:var(--bad);border:1px solid var(--line)}
button:disabled{opacity:.5}
input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin:6px 0 12px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.dev{display:flex;align-items:center;gap:14px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}.dot.on{background:var(--good)}.dot.wait{background:var(--warn)}
.big{font-size:22px;font-weight:800}
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:150px;height:150px}.ring svg{transform:rotate(135deg)}.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .v b{font-size:34px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:14px;padding:10px 12px;border-left:4px solid var(--accent)}
.tile small{color:var(--muted);display:block;font-size:12px}.tile b{font-size:22px}.tile i{font-style:normal;color:var(--muted);font-size:13px;margin-left:4px}
.pills{display:flex;gap:8px;margin-top:12px}.pill{padding:6px 14px;border-radius:20px;background:var(--line);color:var(--muted);font-weight:700;font-size:13px}.pill.on{background:var(--good);color:var(--bg)}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{background:var(--bg);border-radius:10px;padding:6px 8px 8px;position:relative;font-size:13px}.cell span{color:var(--muted)}.cell b{float:right}
.cell .bar{position:absolute;left:0;bottom:0;height:3px;border-radius:2px;background:var(--good)}
.cell.max b{color:var(--bad)}.cell.max .bar{background:var(--bad)}.cell.min b{color:var(--blue)}.cell.min .bar{background:var(--blue)}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;padding:8px}
canvas{width:100%;height:220px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;max-width:90vw;z-index:9}
@media (max-width:480px){.hero{grid-template-columns:1fr;justify-items:center}.cells{grid-template-columns:repeat(3,1fr)}}
</style></head>

<script>
const SB_URL='https://zpsxcdzkayqhzbdcdoed.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwc3hjZHprYXlxaHpiZGNkb2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NTMyODgsImV4cCI6MjEwOTAyOTI4OH0.aAXESY_MJ1IHlvF_8CVdVAGWdfz5ZM6ysoOki7kUv08';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let cur=null,timer=null,hist=24,histAt=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hide'),3500)}
function show(v){['vLogin','vList','vDev'].forEach(x=>$(x).classList.toggle('hide',x!==v));$('btnBack').classList.toggle('hide',v!=='vDev');$('btnOut').classList.toggle('hide',v==='vLogin')}
function fmt(x,d){return typeof x==='number'&&isFinite(x)?x.toFixed(d):'--'}
function ago(ts){const s=(Date.now()-new Date(ts))/1000;return s<60?Math.round(s)+' วินาทีที่แล้ว':s<3600?Math.round(s/60)+' นาทีที่แล้ว':s<86400?Math.round(s/3600)+' ชม.ที่แล้ว':Math.round(s/86400)+' วันที่แล้ว'}
function state(ts,d){const s=(Date.now()-new Date(ts))/1000;if(s>120)return['off','ออฟไลน์'];if(d&&typeof d.v!=='number')return['wait','ออนไลน์ · รอข้อมูล BMS'];return['on','ออนไลน์']}
// ---- auth
async function boot(){const {data}=await sb.auth.getSession();if(data.session){listDevices()}else show('vLogin')}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')show('vLogin')});
$('btnIn').onclick=async()=>{$('loginMsg').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error){$('loginMsg').textContent=error.message==='Email not confirmed'?'กรุณายืนยันอีเมลก่อน (เช็กกล่องจดหมาย)':'เข้าสู่ระบบไม่สำเร็จ: '+error.message}else listDevices()};
$('btnUp').onclick=async()=>{const pw=$('pass').value;if(pw.length<8){$('loginMsg').textContent='รหัสผ่านต้องมีอย่างน้อย 8 ตัว';return}const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)$('loginMsg').textContent='สมัครไม่สำเร็จ: '+error.message;else if(data.session)listDevices();else $('loginMsg').textContent='ส่งอีเมลยืนยันแล้ว กดลิงก์ในอีเมล แล้วกลับมาเข้าสู่ระบบ'};
$('btnOut').onclick=async()=>{clearInterval(timer);await sb.auth.signOut();show('vLogin')};
$('btnBack').onclick=()=>{clearInterval(timer);cur=null;listDevices()};
// ---- devices
async function listDevices(){show('vList');clearInterval(timer);const {data:devs,error}=await sb.from('devices').select('id,name,last_seen,latest(ts,data)').order('created_at');if(error){$('devList').textContent='โหลดไม่สำเร็จ: '+error.message;return}
 if(!devs.length){$('devList').innerHTML='ยังไม่มีอุปกรณ์ เพิ่มด้วยรหัสจับคู่ด้านล่าง';return}
 $('devList').replaceChildren(...devs.map(d=>{const l=d.latest&&(Array.isArray(d.latest)?d.latest[0]:d.latest);const [st,txt]=l?state(l.ts,l.data):['off','ยังไม่มีข้อมูล'];const e=document.createElement('div');e.className='card dev';e.style.background='var(--bg)';e.innerHTML='<span class="dot '+st+'"></span><div style="flex:1"><b></b><div class="small muted"></div></div><div class="big"></div>';e.querySelector('b').textContent=d.name;e.querySelector('.small').textContent=txt+(l?' · '+ago(l.ts):'');e.querySelector('.big').textContent=l&&typeof l.data.soc==='number'?Math.round(l.data.soc)+'%':'';e.onclick=()=>openDev(d);return e}))}
$('btnPair').onclick=async()=>{const code=$('pair').value.trim().toUpperCase();if(!/^[A-Z0-9]{4}-?[A-Z0-9]{4}$/.test(code)){toast('รหัสจับคู่ต้องเป็นแบบ XXXX-XXXX');return}const c=code.includes('-')?code:code.slice(0,4)+'-'+code.slice(4);$('btnPair').disabled=true;const {error}=await sb.rpc('claim_device',{p_pair:c,p_name:$('pairName').value});$('btnPair').disabled=false;if(error)toast(error.message.includes('not found')?'ไม่พบรหัสนี้ หรือถูกเพิ่มไปแล้ว (บอร์ดต้องออนไลน์อย่างน้อย 1 ครั้ง)':'เพิ่มไม่สำเร็จ: '+error.message);else{$('pair').value='';$('pairName').value='';toast('เพิ่มอุปกรณ์แล้ว');listDevices()}};
// ---- dashboard
async function openDev(d){cur=d;show('vDev');$('dName').textContent=d.name;histAt=0;await refresh();timer=setInterval(refresh,5000)}
async function refresh(){if(!cur)return;const {data:l}=await sb.from('latest').select('ts,data').eq('device_id',cur.id).maybeSingle();render(l);if(Date.now()-histAt>60000){histAt=Date.now();loadHistory()}}
function render(l){if(!l){$('dSub').textContent='ยังไม่มีข้อมูลจากบอร์ด';return}const d=l.data,[st,txt]=state(l.ts,d);$('dDot').className='dot '+st;$('dSub').textContent=txt+' · อัปเดต '+ago(l.ts)+(d.bms?' · '+d.bms:'')+(d.model?' · '+d.model:'');
 const soc=typeof d.soc==='number'?Math.round(d.soc):null;$('soc').textContent=soc===null?'--':soc+'%';$('socArc').setAttribute('stroke-dasharray',(soc===null?0:292*soc/100)+' 390');$('socArc').setAttribute('stroke',soc!==null&&soc<=15?'#e85458':soc!==null&&soc<=35?'#e8a040':'#40c878');
 $('v').textContent=fmt(d.v,2);$('i').textContent=fmt(d.i,1);$('p').textContent=fmt(d.p,0);$('cap').textContent=fmt(d.cap,1);$('t1').textContent=fmt(d.t1,0);$('mos').textContent=fmt(d.mos,0);
 $('pChg').classList.toggle('on',!!d.chg);$('pDsg').classList.toggle('on',!!d.dsg);
 const c=d.cells||[];$('cellHead').textContent=c.length?c.length+' เซลล์':'เซลล์';if(c.length){const mn=Math.min(...c),mx=Math.max(...c),lo=mx<3.7?2.5:2.8,hi=mx<3.7?3.65:4.25;$('cellStat').textContent='min '+mn.toFixed(3)+' · max '+mx.toFixed(3)+' · Δ '+Math.round((mx-mn)*1000)+' mV';
  $('cells').replaceChildren(...c.map((v,k)=>{const e=document.createElement('div');e.className='cell'+(v===mx?' max':v===mn?' min':'');e.innerHTML='<span></span><b></b><div class="bar"></div>';e.querySelector('span').textContent=k+1;e.querySelector('b').textContent=v.toFixed(3);e.querySelector('.bar').style.width=Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))+'%';return e}))}else{$('cellStat').textContent='';$('cells').replaceChildren()}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{hist=+b.dataset.h;document.querySelectorAll('.tabs button').forEach(x=>x.className=x===b?'':'soft');loadHistory()});
async function loadHistory(){if(!cur)return;const since=new Date(Date.now()-hist*3600e3).toISOString();const {data,error}=await sb.from('readings').select('ts,soc,voltage,current').eq('device_id',cur.id).gte('ts',since).order('ts').limit(10000);if(error){$('chartNote').textContent=error.message;return}drawChart(data||[])}
function drawChart(rows){const cv=$('chart'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=220;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
 if(rows.length<2){$('chartNote').textContent='ยังมีข้อมูลไม่พอสำหรับกราฟ (บันทึกนาทีละ 1 จุด)';return}
 const t0=new Date(rows[0].ts).getTime(),t1=new Date(rows[rows.length-1].ts).getTime(),X=t=>36+(W-44)*(t-t0)/Math.max(1,t1-t0);
 g.strokeStyle='#2d3a46';g.fillStyle='#84939e';g.font='11px sans-serif';for(let k=0;k<=4;k++){const y=10+(H-30)*k/4;g.beginPath();g.moveTo(36,y);g.lineTo(W-8,y);g.stroke();g.fillText(100-k*25+'%',2,y+4)}
 const line=(key,col,mn,mx)=>{g.strokeStyle=col;g.lineWidth=2;g.beginPath();let first=true;for(const r of rows){if(r[key]==null)continue;const x=X(new Date(r.ts).getTime()),y=10+(H-30)*(1-(r[key]-mn)/Math.max(1e-6,mx-mn));first?g.moveTo(x,y):g.lineTo(x,y);first=false}g.stroke()};
 line('soc','#40c878',0,100);const vs=rows.map(r=>r.voltage).filter(v=>v!=null);if(vs.length){const a=Math.min(...vs),b=Math.max(...vs);line('voltage','#36c4a8',a-0.5,b+0.5);$('chartNote').textContent='เขียว = SOC · ฟ้าเขียว = แรงดัน ('+a.toFixed(1)+'–'+b.toFixed(1)+' V) · '+rows.length+' จุด'}
 g.fillStyle='#84939e';const tf=t=>new Date(t).toLocaleString('th-TH',hist>24?{day:'numeric',month:'short'}:{hour:'2-digit',minute:'2-digit'});g.fillText(tf(t0),36,H-4);g.textAlign='right';g.fillText(tf(t1),W-8,H-4);g.textAlign='left'}
$('btnRename').onclick=async()=>{const n=prompt('ชื่อใหม่',cur.name);if(!n)return;const {error}=await sb.from('devices').update({name:n.slice(0,40)}).eq('id',cur.id);if(error)toast(error.message);else{cur.name=n.slice(0,40);$('dName').textContent=cur.name;toast('เปลี่ยนชื่อแล้ว')}};
$('btnRemove').onclick=async()=>{if(!confirm('ลบอุปกรณ์นี้ออกจากบัญชี? (เพิ่มกลับได้ด้วยรหัสจับคู่เดิม)'))return;const {error}=await sb.rpc('release_device',{p_id:cur.id});if(error)toast(error.message);else{toast('ลบแล้ว');clearInterval(timer);cur=null;listDevices()}};
boot();
</script></body></html>
